name: Release

on:
  push:
    tags:
      - 'v*'

env:
  BINARY_NAME: keytao-dict-checker
  CARGO_TERM_COLOR: always

jobs:
  release:
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''

    runs-on: ${{ matrix.os }}
