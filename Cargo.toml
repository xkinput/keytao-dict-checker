[package]
name = "keytao-dict-checker"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "KeyTao（键道）输入方案词库检查工具"
readme = "README.md"
repository = "https://github.com/GarthTB/keytao-dict-checker"
license = "MIT"
keywords = ["chinese", "dictionary", "input-method", "cli", "maintenance"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }
yaml_serde = "0.10.4"

[profile.release]
strip = "debuginfo"
lto = true
panic = "abort"
codegen-units = 1
